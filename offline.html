<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#0F172A"
    >

    <title>TBBA Portal — Offline</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            margin: 0;

            display: grid;

            place-items: center;

            padding: 24px;

            background: #F8FAFC;

            color: #0F172A;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

        }

        .offline-card {

            width: 100%;

            max-width: 420px;

            padding: 30px;

            border: 1px solid #E2E8F0;

            border-radius: 18px;

            background: #FFFFFF;

            box-shadow:
                0 20px 45px
                rgba(15, 23, 42, .08);

            text-align: center;

        }

        .brand {

            width: 58px;

            height: 58px;

            display: grid;

            place-items: center;

            margin:
                0 auto 18px;

            border-radius: 15px;

            background: #EFF6FF;

            color: #2563EB;

            font-size: 25px;

            font-weight: 800;

        }

        h1 {

            margin: 0;

            font-size: 21px;

        }

        p {

            margin:
                9px 0 22px;

            color: #64748B;

            font-size: 13px;

            line-height: 1.6;

        }

        button {

            min-height: 40px;

            padding:
                9px 17px;

            border: 0;

            border-radius: 10px;

            background: #2563EB;

            color: #FFFFFF;

            font-weight: 750;

            cursor: pointer;

        }

    </style>

</head>

<body>

    <main class="offline-card">

        <div class="brand">
            TB
        </div>

        <h1>
            No internet connection
        </h1>

        <p>
            TBBA Portal keeps business data live and secure,
            so authenticated ERP pages are not served from an old cache.
            Reconnect to the internet and try again.
        </p>

        <button
            type="button"
            onclick="window.location.reload()"
        >
            Try Again
        </button>

    </main>

</body>

</html>
