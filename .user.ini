; DirectAdmin / PHP-FPM production defaults for TBBA ERP.
upload_max_filesize=32M
post_max_size=40M
memory_limit=256M
max_execution_time=120
max_input_time=120
max_input_vars=3000
display_errors=Off
log_errors=On
expose_php=Off
session.use_strict_mode=1
session.cookie_httponly=1
session.cookie_samesite=Lax
